<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Wish Lantern</title>
    <style>
        /* 1. Tangled Night Sky (Deep Purples and Blues) */
        body {
            margin: 0;
            padding: 0;
            /* Soft, magical pastel twilight colors */
            background: linear-gradient(to bottom, #100a26, #2a1b4e, #5c3a75, #a3709d);
            overflow: hidden;
            /* Magical, classic castle-style font */
            font-family: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            }


        /* 2. Magical Floating Menu Box */
        .wish-box {
            background: rgba(44, 22, 77, 0.4);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            text-align: center;
            z-index: 10;
            max-width: 350px;
            width: 90%;
            transition: opacity 1.5s ease;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        p {
            font-size: 13px;
            color: #e0b0ff;
            margin-top: 0;
            margin-bottom: 20px;
            font-style: italic;
        }

        textarea {
            width: 90%;
            height: 80px;
            background: rgba(15, 5, 30, 0.7);
            border: 1px solid #b388ff;
            border-radius: 8px;
            color: #ffe57f;
            padding: 10px;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        button {
            margin-top: 20px;
            background: linear-gradient(45deg, #ffaa44, #ffd700);
            color: #301934;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 170, 68, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ffd700;
        }

        /* 3. The Tangled Paper Lantern Design */
.lantern {
    position: absolute;
    bottom: -160px;
    left: calc(50% - 45px);
    width: 90px;
    height: 130px;
    background: linear-gradient(to top, #ff5500, #ffaa44, #ffee99);
    border-radius: 12px 12px 6px 6px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 15px 10px;
    box-sizing: border-box;
    
    /* 🚀 This links the lantern to the smooth flight/burn animation below */
    animation: flyAndBurn 6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}

/* 🔥 THE FLIGHT & BURN KEYFRAMES */
@keyframes flyAndBurn {
    0% {
        /* Start at the bottom, normal size, glowing warm orange */
        transform: translateY(0) translateX(0) scale(1);
        box-shadow: 0 0 40px #ffaa44, 0 0 80px #ff5500;
        opacity: 1;
    }
    40% {
        /* Gently floating up into the sky, drifting slightly right */
        transform: translateY(-50vh) translateX(20px) scale(0.7);
        opacity: 1;
    }
    75% {
        /* 🔥 BURNING EFFECT: Turns intense fiery crimson, shrinks rapidly */
        background: linear-gradient(to top, #ff1100, #ff5500, #ffaa44);
        box-shadow: 0 0 70px #ff0000, 0 0 140px #ff3300;
        transform: translateY(-90vh) translateX(40px) scale(0.3);
        opacity: 0.8;
    }
    100% {
        /* Disappears into the night sky like an ash particle */
        transform: translateY(-125vh) translateX(50px) scale(0.0);
        box-shadow: 0 0 0px transparent;
        opacity: 0;
    }
}


        /* The Corona Kingdom Sun Emblem inside the code */
        .corona-sun {
            width: 35px;
            height: 35px;
            background: #801000;
            border-radius: 50%;
            position: relative;
            opacity: 0.75;
            box-shadow: 0 0 8px #ff2200;
        }

        /* Creating simple sun rays using CSS shapes */
        .corona-sun::before, .corona-sun::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            border-radius: 30%;
            transform: rotate(30deg);
        }
        .corona-sun::after {
            transform: rotate(60deg);
        }

        .lantern-text {
            color: #550a00;
            font-size: 11px;
            font-weight: bold;
            text-align: center;
            word-break: break-word;
            font-style: italic;
            z-index: 2;
            max-height: 50px;
            overflow: hidden;
        }

        /* 4. Background Kingdom Lights */
.bg-lantern {
    position: absolute;
    /* Soft glowing amber gradient */
    background: radial-gradient(circle, #ffdf99, #ff9944, rgba(255,100,0,0)); /*circle */
    border-radius: 50%;
    /* Blurs the edges to make them look like distant, large lights */
    filter: blur(1px);
    box-shadow: 0 0 20px #ffaa44, 0 0 40px #ff5500; /*changed from 20px*/
    opacity: 0;
    bottom: -50px;
    animation: floatUp 14s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
}

    </style>
</head>
<body>

    <!-- Background Decoration Lights Creator -->
    <script>
// Creates 30 larger background lights
for (let i = 0; i < 30; i++) {
    let bgLight = document.createElement('div');
    bgLight.className = 'bg-lantern';
    // Increased width and height sizes
    let size = Math.random() * 25 + 20; //original 25 + 20
    bgLight.style.width = size + 'px';
    bgLight.style.height = (size * 1.3) + 'px';
    bgLight.style.left = Math.random() * 100 + 'vw';
    bgLight.style.animationDelay = Math.random() * 14 + 's';
    bgLight.style.animationDuration = Math.random() * 6 + 12 + 's';
    document.body.appendChild(bgLight);
}

    </script>

    <!-- The Tangled Wish Box -->
    <div class="wish-box" id="wishBox">
        <h1>Make Your Wish Lantern</h1>
        <p>"Now that I see you..."</p>
        <textarea id="wishInput" placeholder="Write your wish here....."></textarea>
        <br>
        <button onclick="launchLantern()">Release Into The Sky</button>
    </div>

    <script>
function launchLantern() {
    const wishText = document.getElementById('wishInput').value;
    
    if (wishText.trim() === "") {
        alert("Please write your dream down first!");
        return;
    }

    // Hide the text input box smoothly
    document.getElementById('wishBox').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('wishBox').style.display = 'none';
    }, 1000);

    // Build the lantern element
    const lantern = document.createElement('div');
    lantern.className = 'lantern';

    // Add the Corona Sun Logo
    const sun = document.createElement('div');
    sun.className = 'corona-sun';
    lantern.appendChild(sun);

    // Add the user's written wish text
    const textSpan = document.createElement('span');
    textSpan.className = 'lantern-text';
    textSpan.innerText = wishText;
    lantern.appendChild(textSpan);

    // Add it to the screen (The CSS animation starts automatically now!)
    document.body.appendChild(lantern);

    // Clean up and bring back the input menu after the animation finishes
    setTimeout(() => {
        lantern.remove();
        const box = document.getElementById('wishBox');
        document.getElementById('wishInput').value = "";
        box.style.display = 'block';
        setTimeout(() => box.style.opacity = '1', 100);
    }, 6500); // Resets slightly after the 6-second animation ends
}


    </script>
</body>
</html>

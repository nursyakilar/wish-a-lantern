<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Wish Lantern</title>
    <style>
        /* 1. Tangled Night Sky (Deep Purples and Blues) */
        body {
            margin: 0;
            padding: 0;
            /* Soft, magical pastel twilight colors */
            background: linear-gradient(to bottom, #100a26, #2a1b4e, #5c3a75, #a3709d);
            overflow: hidden;
            /* Magical, classic castle-style font */
            font-family: 'Cinzel', 'Palatino Linotype', 'Book Antiqua', Palatino, serif;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            }
/* Fullscreen Welcome Overlay */
.intro-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to bottom, #100a26, #2a1b4e);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100; /* Keeps it on top of everything */
    transition: opacity 1.5s ease, visibility 1.5s ease;
}

/* Button to enter the castle gates */
.enter-btn {
    background: transparent;
    color: #ffd700;
    border: 2px solid #ffd700;
    padding: 15px 40px;
    font-size: 18px;
    font-family: inherit;
    cursor: pointer;
    border-radius: 30px;
    box-shadow: 0 0 15px rgba(255, 215, 0, 0.2);
    transition: 0.4s;
}

.enter-btn:hover {
    background: #ffd700;
    color: #100a26;
    box-shadow: 0 0 30px #ffd700;
    transform: scale(1.05);
}

        /* 2. Magical Floating Menu Box */
        .wish-box {
            background: rgba(44, 22, 77, 0.4);
            padding: 30px;
            border-radius: 20px;
            backdrop-filter: blur(12px);
            border: 1px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
            text-align: center;
            z-index: 10;
            max-width: 350px;
            width: 90%;
            transition: opacity 1.5s ease;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            color: #ffd700;
            text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
        }

        p {
            font-size: 13px;
            color: #e0b0ff;
            margin-top: 0;
            margin-bottom: 20px;
            font-style: italic;
        }

        textarea {
            width: 90%;
            height: 80px;
            background: rgba(15, 5, 30, 0.7);
            border: 1px solid #b388ff;
            border-radius: 8px;
            color: #ffe57f;
            padding: 10px;
            font-size: 14px;
            resize: none;
            outline: none;
        }

        button {
            margin-top: 20px;
            background: linear-gradient(45deg, #ffaa44, #ffd700);
            color: #301934;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(255, 170, 68, 0.4);
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px #ffd700;
        }

        /* 3. The Tangled Paper Lantern Design */
.lantern {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(1);
    
    /* Auto-stretches for paragraphs, but stays a nice size for short wishes */
    width: 260px;
    min-height: 320px;
    height: auto; 
    
    background: linear-gradient(to top, #ff5500, #ffaa44, #ffee99);
    border-radius: 25px 25px 12px 12px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    /* Generous spacing so long text doesn't hit the edges */
    padding: 30px 25px; 
    box-sizing: border-box;
    z-index: 5;
    
    /* Links to the updated slower animation */
    animation: flyAndBurnFromCenter 9s cubic-bezier(0.25, 1, 0.5, 1) forwards;
}



/* 🔥 THE FLIGHT & BURN KEYFRAMES */
@keyframes flyAndBurnFromCenter {
    0% {
        /* Starts big right in the center */
        transform: translate(-50%, -50%) scale(1);
        box-shadow: 0 0 50px #ffaa44, 0 0 100px #ff5500;
        opacity: 1;
    }
    25% {
        /* Stays centered briefly so you can admire your wish */
        transform: translate(-50%, -50%) scale(1.05);
        opacity: 1;
    }
    60% {
        /* Begins lifting up and shrinking slightly */
        transform: translate(-50%, -100vh) scale(0.6);
        opacity: 1;
    }
    85% {
        /* 🔥 BURNING EFFECT: Turns hot crimson and shrinks down fast */
        background: linear-gradient(to top, #ff1100, #ff5500, #ffaa44);
        box-shadow: 0 0 80px #ff0000, 0 0 160px #ff3300;
        transform: translate(-30%, -150vh) scale(0.2);
        opacity: 0.8;
    }
    100% {
        /* Vanishes completely into the night */
        transform: translate(0%, -200vh) scale(0.0);
        box-shadow: 0 0 0px transparent;
        opacity: 0;
    }
}


        /* The Corona Kingdom Sun Emblem inside the code */
.corona-sun {
    width: 70px;
    height: 70px;
    background: #801000;
    border-radius: 50%;
    position: relative;
    opacity: 0.75;
    box-shadow: 0 0 15px #ff2200;
}

        /* Creating simple sun rays using CSS shapes */
        .corona-sun::before, .corona-sun::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: inherit;
            border-radius: 30%;
            transform: rotate(30deg);
        }
        .corona-sun::after {
            transform: rotate(60deg);
        }

.lantern-text {
    color: #550a00;
    font-size: 15px; /* Slightly smaller so more words fit beautifully */
    font-weight: bold;
    text-align: center;
    word-break: break-word;
    font-style: italic;
    z-index: 2;
    margin-top: 15px;
    margin-bottom: 15px;
    line-height: 1.5;
    max-height: 180px; /* Prevents it from getting too tall */
    overflow-y: auto; /* Adds a hidden scroll if it's a massive essay */
}


        /* 4. Background Kingdom Lights */
.bg-lantern {
    position: absolute;
    /* Soft glowing amber gradient */
    background: radial-gradient(circle, #ffdf99, #ff9944, rgba(255,100,0,0)); /*circle */
    border-radius: 50%;
    /* Blurs the edges to make them look like distant, large lights */
    filter: blur(1px);
    box-shadow: 0 0 20px #ffaa44, 0 0 40px #ff5500; /*changed from 20px*/
    opacity: 0;
    bottom: -50px;
    animation: floatUp 14s linear infinite;
}

@keyframes floatUp {
    0% { transform: translateY(0) scale(0.6); opacity: 0; }
    10% { opacity: 0.6; }
    90% { opacity: 0.6; }
    100% { transform: translateY(-110vh) scale(1.5); opacity: 0; }
}

    </style>
</head>
<body>

    <!-- Background Decoration Lights Creator -->
    <script>
// Creates 30 larger background lights
for (let i = 0; i < 40; i++) {
    let bgLight = document.createElement('div');
    bgLight.className = 'bg-lantern';
    // Increased width and height sizes
    let size = Math.random() * 25 + 20; //original 25 + 20
    bgLight.style.width = size + 'px';
    bgLight.style.height = (size * 1.3) + 'px';
    bgLight.style.left = Math.random() * 100 + 'vw';
    bgLight.style.animationDelay = Math.random() * 14 + 's';
    bgLight.style.animationDuration = Math.random() * 6 + 12 + 's';
    document.body.appendChild(bgLight);
}

    </script>

    <!-- The Tangled Wish Box -->
    <div class="wish-box" id="wishBox">
        <h1>Make Your Wish Lantern</h1>
        <p>"Now that I see you..."</p>
        <textarea id="wishInput" placeholder="Write your wish here....."></textarea>
        <br>
        <button onclick="launchLantern()">Release Into The Sky</button>
    </div>

    <!-- The Hidden Audio Player (Loops Forever) -->

        <div class="audio-container" style="text-align: center; margin-top: 30px; margin-bottom: 20px;">
        <audio id="lanternSong" controls loop autoplay>
            <source src="wish.mp3" type="audio/mp3">
            Your browser does not support the audio element.
        </audio>
    </div>

<!-- The Entry Gate Screen -->
<div class="intro-overlay" id="introOverlay">
    <h2 style="color: #ffd700; margin-bottom: 25px; font-style: italic;">"Dare to dream..."</h2>
    <button class="enter-btn" onclick="startMagicalExperience()">Enter Kingdom</button>
</div>

    <script>

        function startMagicalExperience() {
    // 1. Play the music immediately on human interaction
    const song = document.getElementById('lanternSong');
    if (song) {
        song.play().catch(error => console.log("Audio playback error:", error));
    }
    
    // 2. Smoothly fade out the welcome screen
    const overlay = document.getElementById('introOverlay');
    if (overlay) {
        overlay.style.opacity = '0';
        overlay.style.visibility = 'hidden';
    }
}
function launchLantern() {
    const wishText = document.getElementById('wishInput').value;
    
    if (wishText.trim() === "") {
        alert("Please write your dream down first!");
        return;
    }

    // 1. Fade out the text input box smoothly over 1 second
    document.getElementById('wishBox').style.opacity = '0';
    setTimeout(() => {
        document.getElementById('wishBox').style.display = 'none';
    }, 1000);

    // 2. ⏱️ WAIT 2 SECONDS BEFORE CREATING THE LANTERN
    setTimeout(() => {
        
        // Build the lantern element
        const lantern = document.createElement('div');
        lantern.className = 'lantern';
        
        /* Give it a quick smooth fade-in look when it first appears */
        lantern.style.opacity = '0';
        lantern.style.transition = 'opacity 1s ease';

        // Add the Corona Sun Logo
        const sun = document.createElement('div');
        sun.className = 'corona-sun';
        lantern.appendChild(sun);

        // Add the user's paragraph or wish text
        const textSpan = document.createElement('span');
        textSpan.className = 'lantern-text';
        textSpan.innerText = wishText;
        lantern.appendChild(textSpan);

        // Keep the flight animation paused while it sits in the center
        lantern.style.animationPlayState = 'paused';
        document.body.appendChild(lantern);

        // Fade the lantern into view over 1 second
        setTimeout(() => {
            lantern.style.opacity = '1';
        }, 50);

        // 3. Wait another 3 seconds for the user to read it, then let it fly and burn
        setTimeout(() => {
            // Remove the transition property so it doesn't conflict with the flight
            lantern.style.transition = 'none'; 
            lantern.style.animationPlayState = 'running';
        }, 3000); 

        // 4. Clean up and reset everything after the animation finishes
        setTimeout(() => {
            lantern.remove();
            const box = document.getElementById('wishBox');
            document.getElementById('wishInput').value = "";
            box.style.display = 'block';
            setTimeout(() => box.style.opacity = '1', 100);
        }, 12500); 

    }, 2000); // 2000 milliseconds = 2 full seconds of empty sky delay

            // 3. Wait another 3 seconds for the user to read it, then let it fly and burn
        setTimeout(() => {
            lantern.style.transition = 'none'; 
            lantern.style.animationPlayState = 'running';
            
            // 🔊 PLAY THE BURNING SOUND EFFECT RIGHT HERE
            playBurningSound();
            
        }, 3000); 
}

        function playBurningSound() {
    // 1. Setup the browser audio system safely
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const audioCtx = new AudioContext();

    // 2. Low Heat Rumble Sound
    const rumbleOsc = audioCtx.createOscillator();
    const rumbleGain = audioCtx.createGain();
    rumbleOsc.type = 'triangle';
    rumbleOsc.frequency.setValueAtTime(45, audioCtx.currentTime); 
    
    const rumbleMod = audioCtx.createOscillator();
    const rumbleModGain = audioCtx.createGain();
    rumbleMod.frequency.setValueAtTime(8, audioCtx.currentTime);
    rumbleModGain.gain.setValueAtTime(15, audioCtx.currentTime);
    
    rumbleMod.connect(rumbleModGain);
    rumbleModGain.connect(rumbleOsc.frequency);
    
    rumbleGain.gain.setValueAtTime(0.4, audioCtx.currentTime);
    rumbleGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 3.5);
    
    rumbleOsc.connect(rumbleGain);
    rumbleGain.connect(audioCtx.destination);
    
    rumbleOsc.start();
    rumbleMod.start();

    // 3. Crisp Paper Crackling Pops
    const bufferSize = audioCtx.sampleRate * 3.5; 
    const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    
    for (let i = 0; i < bufferSize; i++) {
        if (Math.random() > 0.9991) { // Random crackle spikes
            data[i] = Math.random() * 2 - 1;
            if (i < bufferSize - 1) data[i+1] = data[i] * 0.5;
            if (i < bufferSize - 2) data[i+2] = data[i] * 0.25;
        } else {
            data[i] = 0;
        }
    }

    const crackleNode = audioCtx.createBufferSource();
    crackleNode.buffer = buffer;
    
    const crackleGain = audioCtx.createGain();
    crackleGain.gain.setValueAtTime(0.5, audioCtx.currentTime);
    crackleGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 3.5);
    
    crackleNode.connect(crackleGain);
    crackleGain.connect(audioCtx.destination);
    
    crackleNode.start();

    // 4. Automatically turn off sound nodes when done
    setTimeout(() => {
        try {
            rumbleOsc.stop();
            rumbleMod.stop();
            crackleNode.stop();
            audioCtx.close();
        } catch(e) {}
    }, 3800);
}


    </script>
</body>
</html>
